[build-system]
requires = ["setuptools", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "mlflow",
    "numpy",
    "regex",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pybind11>=3.0",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
