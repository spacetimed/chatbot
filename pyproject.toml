[build-system]
requires = ["setuptools", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "numpy",
    "regex",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pybind11>=3.0",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "references",
]

[tool.ruff.format]
skip-magic-trailing-comma = false
